name: Dart checks
on:
  push:
  pull_request:
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sqlite_plus, sqlite_plus_orm, sqlite_plus_generator, sqlite_plus_arabic, sqlite_plus_vec, sqlite_plus_geo]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Verify binary fixtures
        if: matrix.package == 'sqlite_plus'
        working-directory: .
        # --verify compares recorded checksums. It does not execute SQLite.
        # A mismatch fails this Linux job. The desktop job does not run it.
        run: |
          python3 tool/generate_fixtures.py --verify
          python3 tool/generate_sql_oracle.py --verify
          python3 tool/generate_write_fixture.py --verify
          python3 tool/generate_wal_fixture.py --verify
          python3 tool/generate_semantics_oracle.py --verify
          python3 tool/generate_generated_fixtures.py --verify
          python3 tool/generate_core_function_oracle.py --verify
          python3 tool/generate_printf_oracle.py --verify
          python3 tool/generate_row_value_oracle.py --verify
          python3 tool/generate_source_hint_oracle.py --verify
          python3 tool/generate_percentile_oracle.py --verify
          python3 tool/generate_connection_state_oracle.py --verify
          python3 tool/generate_join_group_oracle.py --verify
          python3 tool/generate_boolean_name_oracle.py --verify
          python3 tool/generate_assignment_oracle.py --verify
          python3 tool/generate_insert_stream_oracle.py --verify
          python3 tool/generate_cte_evaluation_oracle.py --verify
          python3 tool/generate_pragma_table_oracle.py --verify
          python3 tool/generate_aggregate_evaluation_oracle.py --verify
          python3 tool/generate_window_evaluation_oracle.py --verify
          python3 tool/generate_generated_read_oracle.py --verify
          python3 tool/generate_pattern_operator_oracle.py --verify
          python3 tool/generate_numeric_text_oracle.py --verify
          python3 tool/generate_json_oracle.py --verify
          python3 tool/generate_search_oracle.py --verify
          python3 tool/generate_gap_oracle.py --verify
      - name: Build pinned development SQLite reference
        if: matrix.package == 'sqlite_plus' || matrix.package == 'sqlite_plus_orm'
        working-directory: ${{ github.workspace }}
        run: bash tool/build_sqlite_reference.sh
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test packages
        run: dart test
      - name: Check the example project
        working-directory: packages/${{ matrix.package }}/example
        run: |
          dart analyze --fatal-infos
          dart test
          dart run bin/main.dart
      - name: Optimizer VM and JavaScript assertions
        if: matrix.package == 'sqlite_plus'
        working-directory: ${{ github.workspace }}
        run: |
          dart run tool/optimizer_benchmark/assertions.dart
          dart compile js tool/optimizer_benchmark/assertions.dart -o /tmp/optimizer_assertions.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/optimizer_assertions.js
      - name: Compile browser storage JavaScript
        if: matrix.package == 'sqlite_plus'
        run: dart compile js tool/browser_storage_compile.dart -o /tmp/sqlite_plus_browser_storage.js
      - name: Compile and run ORM JavaScript smoke
        if: matrix.package == 'sqlite_plus_orm'
        run: |
          dart run example/prepared.dart
          dart compile js example/prepared.dart -o /tmp/orm_prepared.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/orm_prepared.js
          dart compile js tool/browser_smoke.dart -o /tmp/sqlite_plus_orm_smoke.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/sqlite_plus_orm_smoke.js
  desktop:
    name: Dart tests (${{ matrix.os }}, ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        package: [sqlite_plus, sqlite_plus_orm, sqlite_plus_generator, sqlite_plus_arabic, sqlite_plus_vec, sqlite_plus_geo]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test packages
        run: dart test
      - name: Check the example project
        working-directory: packages/${{ matrix.package }}/example
        run: |
          dart analyze --fatal-infos
          dart test
          dart run bin/main.dart
  search:
    name: Search Phase 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/sqlite_plus_search
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
      - name: Deterministic search tests and example
        run: |
          dart test
          dart run example/main.dart
          dart run tool/platform_smoke.dart
      - name: Compile and execute JavaScript search assertions
        if: matrix.os == 'ubuntu-latest'
        run: |
          dart compile js tool/platform_smoke.dart -o /tmp/sqlite_plus_search.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/sqlite_plus_search.js
  changes:
    name: Changes development milestone
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sqlite_plus_changes
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        working-directory: ${{ github.workspace }}
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: Run examples and JavaScript assertions
        run: |
          dart run example/main.dart
          dart run example/shared_assertions.dart
          dart compile js example/shared_assertions.dart -o /tmp/sqlite_plus_changes.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/sqlite_plus_changes.js

  sync:
    name: Sync development milestone
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sqlite_plus_sync
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        working-directory: ${{ github.workspace }}
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: Run examples and JavaScript assertions
        run: |
          dart run example/main.dart
          dart run example/shared_assertions.dart
          dart compile js example/shared_assertions.dart -o /tmp/sqlite_plus_sync.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/sqlite_plus_sync.js

  reactive:
    name: Reactive and ORM development milestone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        run: dart pub get --enforce-lockfile
      - name: Format and analyze affected packages
        run: |
          dart format --output=none --set-exit-if-changed packages/sqlite_plus_reactive packages/sqlite_plus_orm packages/sqlite_plus_changes
          dart analyze --fatal-infos packages/sqlite_plus_reactive packages/sqlite_plus_orm packages/sqlite_plus_changes
      - name: Reactive and ORM tests
        run: dart test packages/sqlite_plus_reactive/test packages/sqlite_plus_orm/test
      - name: Generated ORM regression tests
        working-directory: packages/sqlite_plus_generator
        run: dart test
      - name: VM and JavaScript assertion examples
        run: |
          dart run packages/sqlite_plus_reactive/example/main.dart
          dart run packages/sqlite_plus_orm/example/reactive.dart
          dart compile js packages/sqlite_plus_reactive/example/main.dart -o /tmp/reactive.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/reactive.js
          dart compile js packages/sqlite_plus_orm/example/reactive.dart -o /tmp/orm_reactive.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/orm_reactive.js

  pagination:
    name: Built-in engine and ORM pagination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        run: dart pub get --enforce-lockfile
      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed packages/sqlite_plus/lib/src/pagination packages/sqlite_plus/test/pagination_test.dart packages/sqlite_plus/test/pagination_native_test.dart packages/sqlite_plus/example/pagination.dart packages/sqlite_plus_orm tool/pagination_benchmark
          dart analyze --fatal-infos packages/sqlite_plus packages/sqlite_plus_orm
      - name: Pagination SQL, ORM and storage tests
        run: dart test packages/sqlite_plus/test/pagination_test.dart packages/sqlite_plus/test/pagination_native_test.dart packages/sqlite_plus/test/pagination_file_test.dart packages/sqlite_plus_orm/test/pagination_test.dart packages/sqlite_plus_orm/test/pagination_storage_test.dart
      - name: VM and JavaScript assertion examples
        run: |
          dart run packages/sqlite_plus/example/pagination.dart
          dart run packages/sqlite_plus_orm/example/pagination.dart
          dart compile js packages/sqlite_plus/example/pagination.dart -o /tmp/pagination.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/pagination.js
          dart compile js packages/sqlite_plus_orm/example/pagination.dart -o /tmp/orm_pagination.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/orm_pagination.js

  inspector:
    name: Inspector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: packages/sqlite_plus_inspector
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ github.workspace }}
        run: bash tool/build_sqlite_reference.sh
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
          dart run example/main.dart
          dart run example/orm.dart
          dart run example/diagnostics.dart
      - name: Compile and run JavaScript assertions
        if: matrix.os == 'ubuntu-latest'
        run: |
          dart compile js example/main.dart -o /tmp/inspector.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/inspector.js
          dart compile js example/orm.dart -o /tmp/inspector_orm.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/inspector_orm.js
          dart compile js example/diagnostics.dart -o /tmp/inspector_diagnostics.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/inspector_diagnostics.js

  direct_writes:
    name: ORM direct updates and upserts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        run: dart pub get --enforce-lockfile
      - name: Analyze and test direct writes
        run: |
          dart analyze --fatal-infos packages/sqlite_plus packages/sqlite_plus_orm
          dart analyze --fatal-infos packages/sqlite_plus_orm/example
          dart test packages/sqlite_plus_orm/test/direct_writes_test.dart packages/sqlite_plus_orm/test/direct_writes_advanced_test.dart packages/sqlite_plus_orm/test/direct_writes_native_test.dart packages/sqlite_plus/test/utf_collation_native_test.dart packages/sqlite_plus/test/upsert_resident_test.dart packages/sqlite_plus/test/upsert_resident_native_test.dart packages/sqlite_plus/test/rowid_conjunct_test.dart packages/sqlite_plus/test/rowid_conjunct_native_test.dart
      - name: VM and JavaScript assertions
        run: |
          dart run packages/sqlite_plus_orm/example/direct_writes.dart
          dart compile js packages/sqlite_plus_orm/example/direct_writes.dart -o /tmp/direct_writes.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/direct_writes.js
          dart run packages/sqlite_plus_orm/example/direct_writes_from_scratch.dart
          dart compile js packages/sqlite_plus_orm/example/direct_writes_from_scratch.dart -o /tmp/direct_writes_from_scratch.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/direct_writes_from_scratch.js

  branches:
    name: Branches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: packages/sqlite_plus_branch
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ github.workspace }}
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
          dart run example/main.dart
          dart run example/orm.dart
          dart run example/typed_values.dart
          dart run example/import_preview.dart
      - name: JavaScript assertion examples
        if: matrix.os == 'ubuntu-latest'
        run: |
          dart compile js example/main.dart -o /tmp/branch.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/branch.js
          dart compile js example/orm.dart -o /tmp/branch_orm.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/branch_orm.js
          dart compile js example/typed_values.dart -o /tmp/branch_typed.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/branch_typed.js
          dart compile js example/import_preview.dart -o /tmp/branch_import_preview.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/branch_import_preview.js

  jobs:
    name: Embedded jobs, leases and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build pinned development SQLite reference
        run: bash tool/build_sqlite_reference.sh
      - name: Install workspace dependencies
        run: dart pub get --enforce-lockfile
      - name: Format, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed packages/sqlite_plus_jobs tool/jobs_benchmark
          dart analyze --fatal-infos packages/sqlite_plus_jobs tool/jobs_benchmark
          dart test packages/sqlite_plus_jobs/test
          dart run packages/sqlite_plus_jobs/example/main.dart
      - name: JavaScript assertions and AOT smoke
        run: |
          dart compile js packages/sqlite_plus_jobs/example/main.dart -o /tmp/jobs.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/jobs.js
          dart compile exe tool/jobs_benchmark/main.dart -o /tmp/jobs-benchmark
          /tmp/jobs-benchmark 100 batch
