name: Dart checks
on:
  push:
  pull_request:
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sqlite_plus, sqlite_plus_orm, sqlite_plus_generator]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Verify binary fixtures
        if: matrix.package == 'sqlite_plus'
        working-directory: .
        # --verify compares recorded checksums. It does not execute SQLite.
        # A mismatch fails this Linux job. The desktop job does not run it.
        run: |
          python3 tool/generate_fixtures.py --verify
          python3 tool/generate_sql_oracle.py --verify
          python3 tool/generate_write_fixture.py --verify
          python3 tool/generate_wal_fixture.py --verify
          python3 tool/generate_semantics_oracle.py --verify
          python3 tool/generate_generated_fixtures.py --verify
          python3 tool/generate_core_function_oracle.py --verify
          python3 tool/generate_printf_oracle.py --verify
          python3 tool/generate_row_value_oracle.py --verify
          python3 tool/generate_source_hint_oracle.py --verify
          python3 tool/generate_percentile_oracle.py --verify
          python3 tool/generate_connection_state_oracle.py --verify
          python3 tool/generate_join_group_oracle.py --verify
          python3 tool/generate_boolean_name_oracle.py --verify
          python3 tool/generate_assignment_oracle.py --verify
          python3 tool/generate_insert_stream_oracle.py --verify
          python3 tool/generate_cte_evaluation_oracle.py --verify
          python3 tool/generate_pragma_table_oracle.py --verify
          python3 tool/generate_aggregate_evaluation_oracle.py --verify
          python3 tool/generate_window_evaluation_oracle.py --verify
          python3 tool/generate_generated_read_oracle.py --verify
          python3 tool/generate_pattern_operator_oracle.py --verify
          python3 tool/generate_numeric_text_oracle.py --verify
          python3 tool/generate_json_oracle.py --verify
          python3 tool/generate_search_oracle.py --verify
          python3 tool/generate_gap_oracle.py --verify
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test packages
        run: dart test
      - name: Check the example project
        working-directory: packages/${{ matrix.package }}/example
        run: |
          dart analyze --fatal-infos
          dart test
          dart run bin/main.dart
      - name: Compile browser storage JavaScript
        if: matrix.package == 'sqlite_plus'
        run: dart compile js tool/browser_storage_compile.dart -o /tmp/sqlite_plus_browser_storage.js
      - name: Compile and run ORM JavaScript smoke
        if: matrix.package == 'sqlite_plus_orm'
        run: |
          dart compile js tool/browser_smoke.dart -o /tmp/sqlite_plus_orm_smoke.js
          node -e 'globalThis.self=globalThis;require(process.argv[1])' /tmp/sqlite_plus_orm_smoke.js
  desktop:
    name: Dart tests (${{ matrix.os }}, ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        package: [sqlite_plus, sqlite_plus_orm, sqlite_plus_generator]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: dart pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test packages
        run: dart test
      - name: Check the example project
        working-directory: packages/${{ matrix.package }}/example
        run: |
          dart analyze --fatal-infos
          dart test
          dart run bin/main.dart
