name: Dart checks
on:
  push:
  pull_request:
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sqlite_plus, sqlite_plus_orm, sqlite_plus_generator]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Verify binary fixtures
        if: matrix.package == 'sqlite_plus'
        working-directory: .
        run: |
          python3 tool/generate_fixtures.py --verify
          python3 tool/generate_sql_oracle.py --verify
          python3 tool/generate_write_fixture.py --verify
          python3 tool/generate_wal_fixture.py --verify
          python3 tool/generate_semantics_oracle.py --verify
          python3 tool/generate_generated_fixtures.py --verify
          python3 tool/generate_core_function_oracle.py --verify
          python3 tool/generate_printf_oracle.py --verify
          python3 tool/generate_row_value_oracle.py --verify
          python3 tool/generate_source_hint_oracle.py --verify
          python3 tool/generate_percentile_oracle.py --verify
          python3 tool/generate_connection_state_oracle.py --verify
          python3 tool/generate_join_group_oracle.py --verify
          python3 tool/generate_boolean_name_oracle.py --verify
          python3 tool/generate_assignment_oracle.py --verify
      - name: Install dependencies
        run: dart pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test engine
        if: matrix.package == 'sqlite_plus'
        run: dart test
