name: sqlite_plus_workspace
description: Workspace for the sqlite_plus engine, ORM, and generator. Not published.
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
workspace:
  - packages/sqlite_plus
  - packages/sqlite_plus/example
  - packages/sqlite_plus_orm
  - packages/sqlite_plus_orm/example
  - packages/sqlite_plus_generator
  - packages/sqlite_plus_generator/example
  - packages/sqlite_plus_arabic
  - packages/sqlite_plus_arabic/example
  - packages/sqlite_plus_vec
  - packages/sqlite_plus_vec/example
  - packages/sqlite_plus_geo
  - packages/sqlite_plus_geo/example
  - packages/sqlite_plus_search
  - packages/sqlite_plus_search/example
  - packages/sqlite_plus_changes
  - packages/sqlite_plus_sync
  - packages/sqlite_plus_reactive
  - packages/sqlite_plus_inspector
  - packages/sqlite_plus_branch
dev_dependencies:
  crypto: any
  sqlite_plus: any
  sqlite_plus_branch: any
